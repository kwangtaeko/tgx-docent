name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: 번들이 소스와 같은지 확인
        run: npm run build && git diff --exit-code skills/docent/scripts/dist skills/docent/assets

  fixture-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/nextjs-sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fixtures/nextjs-sample/package-lock.json
      - run: npm ci
      - run: npm run build
