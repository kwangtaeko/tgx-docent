name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  fixture-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/nextjs-sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fixtures/nextjs-sample/package-lock.json
      - run: npm ci
      - run: npm run build
